<!DOCTYPE html>
<html>
<head>
  <title>Görkem AI</title>

  <style>
    body {
      font-family: Arial;
      background: #111;
      color: white;
      text-align: center;
      margin-top: 40px;
    }

    input, button {
      padding: 10px;
      margin: 5px;
      border-radius: 8px;
      border: none;
    }

    .box {
      margin-top: 20px;
    }

    .game {
      margin-top: 40px;
      padding: 15px;
      border: 1px solid #444;
      display: inline-block;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<h1>Görkem AI 🤖</h1>

<input id="input" placeholder="2+2 veya merhaba yaz" />
<button onclick="cevapla()">Gönder</button>

<div class="box">
  <p id="cevap"></p>
</div>

<!-- 🎮 OYUN 1 -->
<div class="game">
  <h3>🎮 Sayı Tahmin</h3>
  <p>1-10 arası sayı</p>

  <input id="tahmin" placeholder="Tahmin" />
  <button onclick="oyna1()">Tahmin Et</button>

  <p id="sonuc1"></p>
</div>

<!-- 🎮 OYUN 2 -->
<div class="game">
  <h3>⚡ 10 Saniye Refleks Oyunu</h3>

  <p>Süre: <span id="time">10</span></p>
  <p>Puan: <span id="score">0</span></p>

  <button id="btn" onclick="clickBtn()">TIKLA</button>
</div>

<script>

let puan = 0;

// ---------------- AI ----------------
function cevapla() {
  let mesaj = document.getElementById("input").value.toLowerCase().replace(/\s/g,"");
  let cevap = "";

  if (/^[0-9+\-*/().]+$/.test(mesaj)) {
    try {
      cevap = eval(mesaj);
    } catch {
      cevap = "Hatalı işlem";
    }
  }

  else if (mesaj.includes("sahip") || mesaj.includes("kimsin") || mesaj.includes("sahibin")) {
    cevap = "g0rkem_79 instagram";
  }

  else if (mesaj.includes("merhaba")) {
    cevap = "Merhaba!";
  }

  else if (mesaj.includes("nasılsın")) {
    cevap = "İyiyim sen?";
  }

  else {
    cevap = "Matematik yaz (2+2 gibi) veya merhaba de";
  }

  document.getElementById("cevap").innerText = cevap;
}

// ---------------- OYUN 1 ----------------
let sayi = Math.floor(Math.random() * 10) + 1;

function oyna1() {
  let t = document.getElementById("tahmin").value;

  if (t == sayi) {
    document.getElementById("sonuc1").innerText = "🎉 Bildin!";
    sayi = Math.floor(Math.random() * 10) + 1;
  } else if (t > sayi) {
    document.getElementById("sonuc1").innerText = "⬇️ Küçük";
  } else {
    document.getElementById("sonuc1").innerText = "⬆️ Büyük";
  }
}

// ---------------- REFLEKS OYUN ----------------
let score = 0;
let time = 10;
let gameStarted = false;
let timer;

function startGame() {
  gameStarted = true;

  timer = setInterval(() => {
    time--;
    document.getElementById("time").innerText = time;

    if (time <= 0) {
      clearInterval(timer);
      gameStarted = false;
      alert("Oyun bitti! Skor: " + score);
    }
  }, 1000);
}

function clickBtn() {
  if (!gameStarted) startGame();

  if (time <= 0) return;

  score++;
  document.getElementById("score").innerText = score;

  moveButton();
}

function moveButton() {
  let btn = document.getElementById("btn");

  let maxX = window.innerWidth - 100;
  let maxY = window.innerHeight - 100;

  let x = Math.random() * maxX;
  let y = Math.random() * maxY;

  btn.style.position = "fixed";
  btn.style.left = x + "px";
  btn.style.top = y + "px";
}

</script>

</body>
</html>
