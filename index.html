<!DOCTYPE html>
<html>
<head>
  <title>Görkem AI</title>

  <style>
    body {
      font-family: Arial;
      background: #111;
      color: white;
      text-align: center;
      margin-top: 40px;
    }

    input, button {
      padding: 10px;
      margin: 5px;
      border-radius: 8px;
      border: none;
    }

    .box {
      margin-top: 20px;
    }

    .game {
      margin-top: 40px;
      padding: 15px;
      border: 1px solid #444;
      display: inline-block;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<h1>Görkem AI 🤖</h1>

<input id="input" placeholder="2+2 veya merhaba yaz" />
<button onclick="cevapla()">Gönder</button>

<div class="box">
  <p id="cevap"></p>
</div>

<!-- 🎮 OYUN 1 -->
<div class="game">
  <h3>🎮 Sayı Tahmin</h3>
  <p>1-10 arası sayı</p>

  <input id="tahmin" placeholder="Tahmin" />
  <button onclick="oyna1()">Tahmin Et</button>

  <p id="sonuc1"></p>
</div>

<!-- 🎮 OYUN 2 -->
<div class="game">
  <h3>⚡ Hızlı Tıkla</h3>
  <p>Puan: <span id="puan">0</span></p>

  <button onclick="puanla()" id="btn">TIKLA</button>
</div>

<script>

let puan = 0;

// ---------------- AI ----------------
function cevapla() {
  let mesaj = document.getElementById("input").value.toLowerCase().replace(/\s/g,"");
  let cevap = "";

  if (/^[0-9+\-*/().]+$/.test(mesaj)) {
    try {
      cevap = eval(mesaj);
    } catch {
      cevap = "Hatalı işlem";
    }
  }

  else if (mesaj.includes("sahip") || mesaj.includes("kimsin") || mesaj.includes("sahibin")) {
    cevap = "g0rkem_79 instagram";
  }

  else if (mesaj.includes("merhaba")) {
    cevap = "Merhaba!";
  }

  else if (mesaj.includes("nasılsın")) {
    cevap = "İyiyim sen?";
  }

  else {
    cevap = "Matematik yaz (2+2 gibi) veya merhaba de";
  }

  document.getElementById("cevap").innerText = cevap;
}

// ---------------- OYUN 1 ----------------
let sayi = Math.floor(Math.random() * 10) + 1;

function oyna1() {
  let t = document.getElementById("tahmin").value;

  if (t == sayi) {
    document.getElementById("sonuc1").innerText = "🎉 Bildin!";
    sayi = Math.floor(Math.random() * 10) + 1;
  } else if (t > sayi) {
    document.getElementById("sonuc1").innerText = "⬇️ Küçük";
  } else {
    document.getElementById("sonuc1").innerText = "⬆️ Büyük";
  }
}

// ---------------- OYUN 2 ----------------
function puanla() {
  puan++;
  document.getElementById("puan").innerText = puan;

  let btn = document.getElementById("btn");
  btn.style.marginLeft = Math.random() * 100 + "px";
  btn.style.marginTop = Math.random() * 20 + "px";
}

</script>

</body>
</html>
